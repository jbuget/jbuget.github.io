[build]
publish = "public"
command = "sh scripts/install-dart-sass.sh && export PATH=$HOME/.local/dart-sass:$PATH && hugo --gc --minify && npx -y pagefind@1.5.2 --site 'public'"

[build.environment]
DART_SASS_VERSION = "1.107.1"

[context.production.environment]
HUGO_VERSION = "0.169.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "sh scripts/install-dart-sass.sh && export PATH=$HOME/.local/dart-sass:$PATH && hugo --gc --minify --enableGitInfo"

[context.split1.environment]
HUGO_VERSION = "0.169.0"
HUGO_ENV = "production"

[context.deploy-preview]
command = "sh scripts/install-dart-sass.sh && export PATH=$HOME/.local/dart-sass:$PATH && hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.169.0"

[context.branch-deploy]
command = "sh scripts/install-dart-sass.sh && export PATH=$HOME/.local/dart-sass:$PATH && hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.169.0"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"

[[redirects]]
from = "/npmjs/*"
to = "/npmjs/"
status = 200
